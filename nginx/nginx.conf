events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Rate Limiting Zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    upstream backend_servers {
        server backend:8000;
        # For local non-docker dev, replace with: server 127.0.0.1:8000;
    }

    upstream frontend_servers {
        server frontend:3000;
        # For local non-docker dev, replace with: server 127.0.0.1:3000;
    }

    server {
        listen 8080;
        server_name localhost;

        # Basic Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # API Gateway Route -> FastAPI Services
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS Pre-flight Headers
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Request-ID';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Prometheus Metrics Route
        location /metrics {
            proxy_pass http://backend_servers/metrics;
            proxy_set_header Host $host;
        }

        # Health Route
        location /health {
            proxy_pass http://backend_servers/health;
            proxy_set_header Host $host;
        }

        # API Documentation
        location /docs {
            proxy_pass http://backend_servers/docs;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://backend_servers/openapi.json;
            proxy_set_header Host $host;
        }

        # Frontend Route -> Next.js Application
        location / {
            proxy_pass http://frontend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSockets support for Next.js HMR
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
