apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finsaarthi-ingress
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: finsaarthi-backend
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: finsaarthi-frontend
            port:
              number: 3000
